[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-robustness"
version = "0.1.0"
description = "Reproducible experiments for pre-generation evidence assessment in RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.8,<1",
]
pilot = [
  "datasets>=3.0,<4",
  "pandas>=2.1,<3",
  "pyarrow>=15,<20",
  "scikit-learn>=1.4,<2",
  "rank-bm25>=0.2.2,<0.3",
]

[project.scripts]
evidence-robustness = "evidence_robustness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
